name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the database tests. The password only exists
    # inside this CI run, so it isn't a secret.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fledge
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: fledge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fledge -d fledge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://fledge:ci-only@localhost:5432/fledge_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy
      - name: Tests
        run: pytest -v
